    <!-- Critical loader styles: paint the branded preloader with zero JS so
         First Contentful Paint no longer waits on the React bundle. -->
    <style>
      html,body{margin:0;background:#000;color:#fff}
      #root{min-height:100vh}
      .v-boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:12px;background:#000;z-index:100}
      .v-boot i{width:18px;height:18px;border-radius:4px;background:#1a1103;display:block;animation:vb 1.5s ease-in-out infinite}
      .v-boot i:nth-child(1){margin-top:0;animation-delay:0s}
      .v-boot i:nth-child(2){margin-top:28px;animation-delay:.15s}
      .v-boot i:nth-child(3){margin-top:56px;animation-delay:.3s}
      .v-boot i:nth-child(4){margin-top:28px;animation-delay:.45s}
      .v-boot i:nth-child(5){margin-top:0;animation-delay:.6s}
      @keyframes vb{0%,100%{transform:scale(1);background:#F2C572;box-shadow:0 0 15px rgba(242,197,114,.4)}50%{transform:scale(1.3);background:#111;box-shadow:0 5px 15px rgba(0,0,0,.8)}}

        <main style="max-width:900px;margin:0 auto;padding:80px 24px;font-family:system-ui,sans-serif">
          <h1 style="font-size:2.5rem;font-weight:800;margin-bottom:16px;background:linear-gradient(to bottom,#fff,#999);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Veilpay — Private Crypto Payments & Anonymous Donations</h1>
          <p style="color:#999;font-size:1.1rem;line-height:1.7;margin-bottom:32px">Veilpay is a <strong style="color:#F2C572">non-custodial crypto vault</strong> that uses EIP-5564 stealth addresses and zero-knowledge proofs to make private payments practical for everyday use. Send, receive, and hold crypto across 7+ blockchains — Stellar, Monero, Zcash, Ethereum, Solana, Base, and Arbitrum — without exposing your wallet address or financial history.</p>
          <h2 style="color:#F2C572;font-size:1.5rem;margin-bottom:12px">Core Privacy Features</h2>
          <ul style="color:#aaa;line-height:2;margin-bottom:32px">
            <li><strong style="color:#fff">EIP-5564 Stealth Addresses</strong> — Generate a unique one-time address for every incoming payment, breaking on-chain linkability.</li>
            <li><strong style="color:#fff">Zero-Knowledge Proofs</strong> — Mathematically verify payments without revealing sender, receiver, or amount.</li>
            <li><strong style="color:#fff">Multi-Chain Privacy</strong> — Native support for Stellar, Monero, Zcash, Ethereum, Solana, Base, and Arbitrum.</li>
            <li><strong style="color:#fff">Non-Custodial Vault</strong> — Your keys never leave your device. No KYC required.</li>
            <li><strong style="color:#fff">Fiat On-Ramps</strong> — Buy crypto and enter the private ecosystem seamlessly.</li>
          </ul>
          <h2 style="color:#F2C572;font-size:1.5rem;margin-bottom:12px">Accept Crypto Donations Privately</h2>
          <p style="color:#999;line-height:1.7;margin-bottom:32px">Use Veilpay to accept anonymous crypto donations without exposing your public wallet address. Stealth addresses ensure complete donor privacy across all supported chains.</p>

    <!-- iOS "liquid glass" refraction: distorts whatever is behind the glass
         using fractal noise + displacement. Referenced by .ios-glass via
         backdrop-filter: url(#liquid-glass). Zero-size, no layout impact. -->
    <svg width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none">
      <filter id="liquid-glass" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.011 0.013" numOctaves="2" seed="17" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="1.4" result="soft" />
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="24" xChannelSelector="R" yChannelSelector="G" />
      </filter>
